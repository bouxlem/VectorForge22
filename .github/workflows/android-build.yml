name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # البحث عن ملف gradlew وإعطائه الصلاحية أو إنشاؤه إن لم يكن موجوداً
      - name: Prepare Gradle Wrapper
        run: |
          # البحث عن مكان gradlew داخل المستودع
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -print -quit)
          
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH"
            chmod +x "$GRADLEW_PATH"
          else
            echo "gradlew not found, generating wrapper..."
            # البحث عن المجلد الذي يحتوي على app أو build.gradle.kts
            PROJECT_DIR=$(find . -maxdepth 2 -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
            if [ -n "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR"
            fi
            gradle wrapper
            chmod +x gradlew
          fi

      # بناء ملف الـ APK
      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -print -quit)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # رفع ملف الـ APK النامج
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorForge-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
