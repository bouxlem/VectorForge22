name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. التوجه لمجلد vectorforge2 وإعطاء تصريح التشغيل
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: vectorforge2

      # 2. بناء الـ APK من داخل مجلد vectorforge2
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: vectorforge2

      # 3. العثور على الـ APK المبنّي ورفعه
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorForge-Debug-APK
          path: vectorforge2/app/build/outputs/apk/debug/app-debug.apk
