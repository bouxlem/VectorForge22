name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. إنشاء ملف .env.example وهمي ليتجاوز Gradle الخطأ
      - name: Create missing .env.example file
        run: |
          touch vectorforge2/.env.example
          touch vectorforge2/.env

      # 2. تجهيز Gradle Wrapper
      - name: Prepare Gradle Wrapper
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
          else
            cd vectorforge2
            gradle wrapper
            chmod +x gradlew
          fi

      # 3. بناء الـ APK
      - name: Build Debug APK
        run: |
          cd vectorforge2
          ./gradlew assembleDebug --stacktrace

      # 4. رفع الـ APK المبنّي
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorForge-Debug-APK
          path: vectorforge2/app/build/outputs/apk/debug/app-debug.apk
