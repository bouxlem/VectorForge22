name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من واجهة GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. استخراج الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java / JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. منح صلاحيات التشغيل لملف gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء ملف الـ APK (Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. رفع ملف الـ APK كـ Artifact لتتمكن من تحميله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorForge-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
